<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="color-scheme" content="light">
<title>DSH Desktop</title>
<style>
  :root {
    --paper:#F4F5F2;
    --paper-high:#FAFAF8;
    --ink:#181A1F;
    --ink-soft:#3D4149;
    --muted:#737883;
    --future:#B9BBB9;
    --line:rgba(24,26,31,.18);
    --cobalt:#4D6BFE;
    --ice:#B9C7FF;
    --progress:16.666%;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; }
  body {
    overflow:hidden;
    background:var(--paper);
    color:var(--ink);
    font-family:'Aptos','Microsoft YaHei UI','Microsoft YaHei',sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:geometricPrecision;
    isolation:isolate;
  }
  body[data-phase="runtime"] { --progress:50%; }
  body[data-phase="interface"] { --progress:83.333%; }

  /* 深海测绘图谱：所有线条都围绕粒子鲸的流场展开。 */
  .survey-field {
    position:fixed;
    inset:0;
    z-index:-2;
    width:100%;
    height:100%;
    pointer-events:none;
  }
  .survey-field .contour {
    fill:none;
    stroke:var(--ink);
    stroke-width:1;
    stroke-linecap:round;
    opacity:.105;
  }
  .survey-field .current {
    fill:none;
    stroke:var(--cobalt);
    stroke-width:.9;
    stroke-linecap:round;
    opacity:.12;
    stroke-dasharray:2 8;
    animation:currentFlow 18s linear infinite;
  }
  .survey-field .current:nth-child(2) { animation-duration:23s; animation-direction:reverse; }
  .survey-field .current:nth-child(3) { animation-duration:29s; }
  .survey-field .survey-mark {
    fill:none;
    stroke:var(--cobalt);
    stroke-width:1;
    opacity:.42;
  }
  @keyframes currentFlow { to { stroke-dashoffset:-160; } }

  .splash-shell {
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    display:grid;
    grid-template-rows:minmax(0,1fr) auto;
    padding:clamp(18px,3vh,34px) clamp(36px,5.5vw,78px) clamp(24px,4.5vh,46px);
  }
  .hero {
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding-top:clamp(0px,2vh,18px);
  }
  .whale-stage {
    position:relative;
    width:min(820px,84vw);
    height:clamp(250px,48vh,420px);
    display:grid;
    place-items:center;
    opacity:0;
    animation:whaleIn 1.15s cubic-bezier(.2,.78,.2,1) .05s forwards;
  }
  #whale {
    display:block;
    max-width:100%;
    max-height:100%;
    cursor:default;
  }
  .brand {
    margin-top:clamp(-8px,-.8vh,-2px);
    color:var(--ink);
    font-family:'Bahnschrift SemiCondensed','Bahnschrift',sans-serif;
    font-size:clamp(38px,4.4vw,60px);
    font-weight:300;
    font-stretch:semi-condensed;
    line-height:1;
    letter-spacing:.215em;
    text-indent:.215em;
    text-transform:uppercase;
    white-space:nowrap;
    user-select:none;
    opacity:0;
    animation:brandIn .8s cubic-bezier(.2,.7,.2,1) .62s forwards;
  }

  .progress-panel {
    width:min(850px,78vw);
    justify-self:center;
    text-align:center;
    opacity:0;
    animation:panelIn .65s ease-out .86s forwards;
  }
  .stage-meter { position:relative; }
  .stage-list {
    display:grid;
    grid-template-columns:repeat(3,1fr);
    list-style:none;
    min-height:44px;
    font-family:'Cascadia Mono','Consolas',monospace;
    font-size:13px;
    letter-spacing:.08em;
    color:var(--future);
  }
  .rail,
  .rail-fill {
    position:absolute;
    left:0;
    bottom:3px;
    height:2px;
  }
  .rail { right:0; background:var(--line); }
  .rail-fill {
    width:var(--progress);
    background:var(--cobalt);
    transition:width .7s cubic-bezier(.2,.75,.2,1);
  }
  .stage {
    position:relative;
    z-index:1;
    transition:color .2s ease;
  }
  .stage::after {
    content:'';
    position:absolute;
    left:50%;
    bottom:0;
    width:8px;
    height:8px;
    background:var(--future);
    transform:translateX(-50%);
    transition:background-color .2s ease, transform .2s ease;
  }
  body[data-phase="environment"] [data-stage="environment"],
  body[data-phase="runtime"] [data-stage="runtime"],
  body[data-phase="interface"] [data-stage="interface"] { color:var(--ink); }
  body[data-phase="environment"] [data-stage="environment"]::after,
  body[data-phase="runtime"] [data-stage="runtime"]::after,
  body[data-phase="interface"] [data-stage="interface"]::after {
    background:var(--cobalt);
    transform:translateX(-50%) scale(1.12);
  }
  body[data-phase="runtime"] [data-stage="environment"],
  body[data-phase="interface"] [data-stage="environment"],
  body[data-phase="interface"] [data-stage="runtime"] { color:var(--ink-soft); }
  body[data-phase="runtime"] [data-stage="environment"]::after,
  body[data-phase="interface"] [data-stage="environment"]::after,
  body[data-phase="interface"] [data-stage="runtime"]::after { background:var(--ink); }

  .status-row {
    min-height:31px;
    margin-top:24px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
  }
  .status-particles { display:flex; align-items:flex-end; gap:5px; height:12px; }
  .status-particles i {
    display:block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--cobalt);
    animation:particlePulse 1.35s ease-in-out infinite;
  }
  .status-particles i:nth-child(2) { opacity:.72; animation-delay:.16s; }
  .status-particles i:nth-child(3) { opacity:.35; animation-delay:.32s; }
  .status-text {
    font-size:clamp(16px,1.45vw,20px);
    font-weight:400;
    letter-spacing:.075em;
    color:var(--ink-soft);
    transition:opacity .14s ease, transform .14s ease;
  }
  .status-text.is-changing { opacity:0; transform:translateY(4px); }
  .tip {
    margin-top:11px;
    min-height:18px;
    color:var(--muted);
    font-size:13px;
    letter-spacing:.02em;
    transition:opacity .18s ease;
  }

  @keyframes whaleIn {
    from { opacity:0; transform:translateY(-9px); }
    to { opacity:1; transform:none; }
  }
  @keyframes brandIn {
    from { opacity:0; transform:translateY(9px); letter-spacing:.245em; }
    to { opacity:1; transform:none; letter-spacing:.215em; }
  }
  @keyframes panelIn {
    from { opacity:0; transform:translateY(8px); }
    to { opacity:1; transform:none; }
  }
  @keyframes particlePulse {
    0%,100% { transform:translateY(1px); opacity:.28; }
    45% { transform:translateY(-3px); opacity:1; }
  }

  @media (max-height:700px) {
    .splash-shell { padding-top:12px; padding-bottom:22px; }
    .whale-stage { height:clamp(230px,44vh,310px); }
    .brand { font-size:clamp(35px,4vw,48px); }
    .status-row { margin-top:18px; }
    .tip { margin-top:8px; }
  }
  @media (max-width:760px) {
    .splash-shell { padding-left:24px; padding-right:24px; }
    .whale-stage { width:92vw; }
    .brand { font-size:clamp(30px,7vw,42px); letter-spacing:.16em; text-indent:.16em; }
    .progress-panel { width:88vw; }
  }
  @media (prefers-reduced-motion:reduce) {
    .survey-field .current,
    .whale-stage,
    .brand,
    .progress-panel,
    .status-particles i { animation:none; }
    .whale-stage,
    .brand,
    .progress-panel { opacity:1; }
    .rail-fill,
    .status-text { transition:none; }
  }
</style>

],[38.26,39.67,0],[10.66,40.59,0],[11.58,40.59,0],[12.5,40.59,0],[13.42,40.59,0],[14.34,40.59,0],[15.26,40.59,0],[16.18,40.59,0],[17.1,40.59,0],[18.02,40.59,0],[18.94,40.59,0],[19.86,40.59,0],[20.78,40.59,0],[21.7,40.59,0],[22.62,40.59,0],[23.54,40.59,0],[24.46,40.59,0],[25.38,40.59,0],[26.3,40.59,0],[27.22,40.59,0],[28.14,40.59,0],[29.06,40.59,0],[12.5,41.51,0],[13.42,41.51,0],[14.34,41.51,0],[15.26,41.51,0],[16.18,41.51,0],[17.1,41.51,0],[18.02,41.51,0],[18.94,41.51,0],[19.86,41.51,0],[20.78,41.51,0],[21.7,41.51,0],[22.62,41.51,0],[23.54,41.51,0],[24.46,41.51,0],[25.38,41.51,0],[26.3,41.51,0],[27.22,41.51,0],[28.14,41.51,0],[14.34,42.43,0],[15.26,42.43,0],[16.18,42.43,0],[17.1,42.43,0],[18.02,42.43,0],[18.94,42.43,0],[19.86,42.43,0],[20.78,42.43,0],[21.7,42.43,0],[22.62,42.43,0],[23.54,42.43,0],[24.46,42.43,0],[25.38,42.43,0]]
  const canvas = document.getElementById('whale')
  const ctx = canvas && canvas.getContext('2d')
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches
  const statusText = document.getElementById('status-text')
  const statusNote = document.getElementById('status-note')
  const stageElements = Array.from(document.querySelectorAll('[data-stage]'))
  const phaseMessages = {
    environment:'正在检测运行环境…',
    runtime:'正在校验内嵌运行时…',
    interface:'正在启动本地界面…',
  }
  let statusTimer = 0

  function setPhase(phase, message, note) {
    if (!Object.prototype.hasOwnProperty.call(phaseMessages, phase)) return false
    document.body.dataset.phase = phase
    for (const item of stageElements) {
      if (item.dataset.stage === phase) item.setAttribute('aria-current', 'step')
      else item.removeAttribute('aria-current')
    }
    const nextMessage = typeof message === 'string' && message.trim()
      ? message.trim()
      : phaseMessages[phase]
    clearTimeout(statusTimer)
    if (REDUCED || statusText.textContent === nextMessage) {
      statusText.textContent = nextMessage
      statusText.classList.remove('is-changing')
    } else {
      statusText.classList.add('is-changing')
      statusTimer = window.setTimeout(() => {
        statusText.textContent = nextMessage
        statusText.classList.remove('is-changing')
      }, 140)
    }
    if (typeof note === 'string' && note.trim()) statusNote.textContent = note.trim()
    return true
  }

  window.dshSplash = Object.freeze({
    setPhase,
    getState:() => ({
      phase:document.body.dataset.phase,
      message:statusText.textContent,
      note:statusNote.textContent,
    }),
  })

  const previewPhase = new URLSearchParams(location.search).get('phase')
  if (previewPhase) setPhase(previewPhase)

  // 状态反馈不依赖 Canvas；极端图形环境下仍应如实显示启动进度。
  if (!canvas || !ctx) return

  let W = 0, H = 0
  let targets = null
  let particles = []
  let raf = 0
  let t0 = 0
  let previousFrame = 0
  const mouse = { x:0, y:0, active:false }
  const MOUSE_R = 132

  function seeded(index, salt) {
    const value = Math.sin((index + 1) * 12.9898 + salt * 78.233) * 43758.5453
    return value - Math.floor(value)
  }

  function hexLerp(a, b, t) {
    const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16)
    const r = ((ah >> 16) & 255) + (((bh >> 16) & 255) - ((ah >> 16) & 255)) * t
    const g = ((ah >> 8) & 255) + (((bh >> 8) & 255) - ((ah >> 8) & 255)) * t
    const bl = (ah & 255) + ((bh & 255) - (ah & 255)) * t
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (bl | 0) + ')'
  }

  function layout() {
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9
    for (const p of WHALE_POINTS) {
      if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0]
      if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]
    }
    const stage = canvas.parentElement.getBoundingClientRect()
    const pointW = maxX - minX, pointH = maxY - minY
    const targetH = Math.max(205, Math.min(430, stage.height * .96, (stage.width - 36) * pointH / pointW))
    const scale = targetH / pointH
    const whaleW = pointW * scale
    W = Math.ceil(whaleW + 52); H = Math.ceil(targetH + 28)
    const dpr = Math.min(window.devicePixelRatio || 1, 2)
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px'
    canvas.width = Math.ceil(W * dpr); canvas.height = Math.ceil(H * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    const ox = (W - whaleW) / 2 - minX * scale
    const oy = (H - targetH) / 2 - minY * scale
    targets = WHALE_POINTS.map((p, index) => {
      const yNorm = (p[1] - minY) / pointH
      const tone = seeded(index, 1)
      let color
      if (p[2]) color = tone < .20 ? '#181A1F' : tone < .62 ? '#4D6BFE' : '#93A9FF'
      else color = tone < .055 ? '#2D3440' : hexLerp('#B9C7FF', '#4D6BFE', .18 + yNorm * .72)
      return {
        x:p[0] * scale + ox,
        y:p[1] * scale + oy,
        r:p[2] ? 1.45 + seeded(index, 2) * 1.05 : .9 + seeded(index, 2) * .9,
        color,
        phase:seeded(index, 3) * Math.PI * 2,
        seed:index,
      }
    })
    spawn()
  }

  function spawn() {
    if (!targets) return
    const cx = W / 2, cy = H / 2
    particles = targets.map((target) => {
      const angle = seeded(target.seed, 4) * Math.PI * 2
      const radius = 70 + seeded(target.seed, 5) * Math.max(W, H) * .57
      return {
        ...target,
        tx:target.x,
        ty:target.y,
        x:cx + Math.cos(angle) * radius,
        y:cy + Math.sin(angle) * radius,
        vx:0,
        vy:0,
        alpha:0,
        born:seeded(target.seed, 6) * .52,
        speed:.86 + seeded(target.seed, 7) * .68,
      }
    })
    t0 = performance.now()
    previousFrame = 0
  }

  function drawStatic() {
    ctx.clearRect(0, 0, W, H)
    for (const p of particles) {
      ctx.globalAlpha = .9
      ctx.fillStyle = p.color
      ctx.beginPath(); ctx.arc(p.tx, p.ty, p.r, 0, 6.2832); ctx.fill()
    }
    ctx.globalAlpha = 1
  }

  function frame(now) {
    if (document.hidden) { previousFrame = now; raf = requestAnimationFrame(frame); return }
    const t = (now - t0) / 1000
    const dt = previousFrame ? Math.min(.04, (now - previousFrame) / 1000) : .016
    previousFrame = now
    ctx.clearRect(0, 0, W, H)

    const scanProgress = (t % 5.8) / 5.8
    const scanX = W * (.07 + scanProgress * .86)
    if (t > .8) {
      ctx.globalAlpha = .11
      ctx.fillStyle = '#4D6BFE'
      ctx.fillRect(scanX, H * .1, 1, H * .8)
    }

    for (const p of particles) {
      const age = t - p.born
      if (age > 0) {
        const settle = 1 - Math.pow(.0014, dt * p.speed)
        p.x += (p.tx - p.x) * settle
        p.y += (p.ty - p.y) * settle
      }
      if (mouse.active) {
        const dx = p.x - mouse.x, dy = p.y - mouse.y
        const distanceSquared = dx * dx + dy * dy
        if (distanceSquared < MOUSE_R * MOUSE_R) {
          const distance = Math.sqrt(distanceSquared) || 1
          const force = (1 - distance / MOUSE_R) * 650 * dt
          p.vx += dx / distance * force
          p.vy += dy / distance * force
        }
      }
      p.vx *= Math.pow(.1, dt); p.vy *= Math.pow(.1, dt)
      p.x += p.vx * dt; p.y += p.vy * dt
      if (age < .74) p.alpha = Math.max(0, Math.min(1, age / .74))

      const idle = Math.min(1, Math.max(0, (age - 2.4) / 1.4))
      const drawX = p.x + Math.sin(t * .66 + p.phase) * .48 * idle
      const drawY = p.y + Math.cos(t * .58 + p.phase) * .48 * idle
      const scanLift = Math.abs(drawX - scanX) < 13 ? .17 : 0
      ctx.globalAlpha = Math.min(1, p.alpha * (.78 + .13 * Math.sin(t * 1.25 + p.phase)) + scanLift)
      ctx.fillStyle = p.color
      ctx.beginPath(); ctx.arc(drawX, drawY, p.r, 0, 6.2832); ctx.fill()
    }
    ctx.globalAlpha = 1
    raf = requestAnimationFrame(frame)
  }

  canvas.addEventListener('pointermove', (event) => {
    const rect = canvas.getBoundingClientRect()
    mouse.x = (event.clientX - rect.left) * (W / rect.width)
    mouse.y = (event.clientY - rect.top) * (H / rect.height)
    mouse.active = true
  })
  canvas.addEventListener('pointerleave', () => { mouse.active = false })
  window.addEventListener('resize', layout)

  layout()
  if (REDUCED) drawStatic()
  else raf = requestAnimationFrame(frame)
})()
</script>
